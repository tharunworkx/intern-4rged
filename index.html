<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO List</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div id="input-container">
        <h3>TODO list</h3>
        <section id="inner_cont">
            <input id="input" placeholder="Enter a task...">
            <select id="category-select">
                <option value="Work">Work</option>
                <option value="Personal">Personal</option>
                <option value="Urgent">Urgent</option>
            </select>
            <button id="addbtn">ADD</button>
        </section>
    </div>

    <!-- Progress bar section -->
    <div id="progress-container">
        <div class="progress-header">
            <span class="progress-title">Task Progress</span>
            <span id="progress-stats">0% Completed (0/0)</span>
        </div>
        <div class="progress-track">
            <div id="progress-bar"></div>
        </div>
    </div>

    <div id="todo-container">
        <div class="filter-bar">
            <input id="search-input" type="search" placeholder="Search tasks..." aria-label="Search tasks">
        </div>
        <ul>
           
        </ul>
    </div>

    <script src="./script.js"></script>
</body>
</html>
