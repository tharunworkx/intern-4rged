<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO List</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <!-- Header / Input section -->
    <header id="input-container">
        <h3>TODO List</h3>
        <section id="inner_cont">
            <input id="input" type="text" placeholder="Enter a task..." autocomplete="off">
            <select id="category-select">
                <option value="Work">Work</option>
                <option value="Personal">Personal</option>
                <option value="Urgent">Urgent</option>
            </select>
            <button id="addbtn">Add</button>
        </section>
    </header>

    <div class="main-content">
        <!-- Progress Bar Section -->
        <section id="progress-container">
            <div class="progress-header">
                <span class="progress-title">Task Progress</span>
                <span id="progress-stats">0% (0 of 0 completed)</span>
            </div>
            <div class="progress-track">
                <div id="progress-bar"></div>
            </div>
        </section>

        <!-- Todo Container -->
        <section id="todo-container">
            <ul id="task-matrix">
                <!-- Tasks will be rendered here -->
            </ul>
        </section>
    </div>

    <script src="./script.js"></script>
</body>
</html>
